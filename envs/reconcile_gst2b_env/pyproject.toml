[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-reconcile_gst2b_env"
version = "0.1.0"
description = "GST Input-Tax-Credit reconciliation environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "pydantic>=2.5",
    "numpy",
    "pandas",
    "networkx",
    "matplotlib",
    "gradio>=4.0.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m reconcile_gst2b_env.server.app
server = "reconcile_gst2b_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["reconcile_gst2b_env", "reconcile_gst2b_env.server"]
package-dir = { "reconcile_gst2b_env" = ".", "reconcile_gst2b_env.server" = "server" }